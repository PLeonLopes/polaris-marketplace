# Publishes a GitHub Release for every push to main.
#
# The version is derived from the commit subjects since the previous v* tag
# (scripts/ci/determine-bump.sh): breaking (!) → major, feat → minor, else → patch.
# Release notes are generated by GitHub from the merged pull requests; the
# Releases page is the project changelog.
name: Release

on:
  push:
    branches: [main]

# Releases are sequential: never cancel one, never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release: starting from v0.0.0."
            CURRENT="0.0.0"
            RANGE="HEAD"
          else
            echo "Previous release: $LATEST_TAG"
            CURRENT="${LATEST_TAG#v}"
            RANGE="$LATEST_TAG..HEAD"
          fi

          SUBJECTS=$(git log --no-merges --format=%s "$RANGE")
          if [ -z "$SUBJECTS" ]; then
            echo "No new commits since $LATEST_TAG. Nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP=$(printf '%s\n' "$SUBJECTS" | bash scripts/ci/determine-bump.sh)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Commits since ${LATEST_TAG:-the beginning}:"
          sed 's/^/  - /' <<< "$SUBJECTS"
          echo "Bump: $BUMP → v$NEXT"
          {
            echo "skip=false"
            echo "tag=v$NEXT"
            echo "previous=$LATEST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          ARGS=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREVIOUS" ]; then
            ARGS+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$TAG" "${ARGS[@]}"
