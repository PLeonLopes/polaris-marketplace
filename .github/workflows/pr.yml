# Quality gates for every pull request targeting main.
# Each job name below becomes a status check that branch protection can require.
name: PR checks

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run in progress.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate every commit in the pull request
        run: |
          bash scripts/ci/check-commit-messages.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  lint:
    name: Lint & Check (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # pytest has its own job below; skip it here to avoid running the suite twice.
      - name: Run pre-commit on all files
        env:
          SKIP: pytest
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # Plugins ship shell scripts for Windows, macOS and Linux, so the suite runs on all three.
  # Git Bash runs the scripts on Windows, as it does for Claude Code hooks there.
  tests-os:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked

      # The status line tests skip without jq; fail instead if a runner image drops it.
      - name: Require jq
        run: jq --version

      - name: Run tests
        run: uv run pytest

  # Single status check named "Tests", so the ruleset does not depend on the matrix.
  tests:
    name: Tests
    needs: tests-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.tests-os.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
              echo "Tests did not pass on every platform (result: $RESULT)."
              exit 1
          fi

  plugin-versions:
    name: Plugin versions bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Check plugin and marketplace version bumps
        run: uv run scripts/ci/check-plugin-versions.py "${{ github.event.pull_request.base.sha }}"
